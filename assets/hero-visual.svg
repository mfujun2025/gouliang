<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="一只开心的狗狗与狗粮碗">
  <defs>
    <linearGradient id="hv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E1C9"/>
      <stop offset="1" stop-color="#EEA36D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hv-bg)"/>
  <!-- 背景装饰圆 -->
  <circle cx="660" cy="120" r="90" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="120" cy="480" r="60" fill="#FFFFFF" opacity="0.14"/>

  <!-- 狗狗 -->
  <g transform="translate(220 140)">
    <!-- 身体 -->
    <ellipse cx="180" cy="280" rx="150" ry="110" fill="#D9A06B"/>
    <ellipse cx="180" cy="290" rx="120" ry="80" fill="#E8B384"/>
    <!-- 腿 -->
    <rect x="110" y="350" width="30" height="60" rx="14" fill="#C08B56"/>
    <rect x="170" y="350" width="30" height="60" rx="14" fill="#C08B56"/>
    <rect x="230" y="350" width="30" height="60" rx="14" fill="#C08B56"/>
    <rect x="290" y="350" width="30" height="60" rx="14" fill="#C08B56"/>
    <!-- 头 -->
    <circle cx="330" cy="170" r="95" fill="#D9A06B"/>
    <!-- 耳朵 -->
    <ellipse cx="260" cy="100" rx="40" ry="55" fill="#B57F4E" transform="rotate(-25 260 100)"/>
    <ellipse cx="400" cy="100" rx="40" ry="55" fill="#B57F4E" transform="rotate(25 400 100)"/>
    <!-- 脸部 -->
    <ellipse cx="330" cy="200" rx="62" ry="48" fill="#E8B384"/>
    <!-- 眼睛 -->
    <circle cx="300" cy="155" r="13" fill="#2A2520"/>
    <circle cx="360" cy="155" r="13" fill="#2A2520"/>
    <circle cx="304" cy="151" r="4" fill="#FFFFFF"/>
    <circle cx="364" cy="151" r="4" fill="#FFFFFF"/>
    <!-- 鼻子 -->
    <ellipse cx="330" cy="192" rx="14" ry="10" fill="#2A2520"/>
    <!-- 嘴巴 -->
    <path d="M330 202 Q330 220 315 222 M330 202 Q330 220 345 222" stroke="#2A2520" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 舌头 -->
    <ellipse cx="330" cy="228" rx="14" ry="10" fill="#E8602C"/>
    <!-- 项圈 -->
    <path d="M255 235 Q330 280 405 235" stroke="#E8602C" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="330" cy="272" r="16" fill="#FFB084" stroke="#E8602C" stroke-width="5"/>
  </g>

  <!-- 狗粮碗 -->
  <g transform="translate(380 330)">
    <ellipse cx="120" cy="150" rx="140" ry="30" fill="#C24516" opacity="0.18"/>
    <path d="M0 40h240a6 6 0 0 1 6 6v34a40 40 0 0 1-40 40H34a40 40 0 0 1-40-40V46a6 6 0 0 1 6-6z" fill="#E8602C"/>
    <ellipse cx="120" cy="40" rx="120" ry="26" fill="#FFB084"/>
    <ellipse cx="120" cy="38" rx="120" ry="24" fill="#FFF6EE"/>
    <!-- 颗粒 -->
    <circle cx="80" cy="36" r="14" fill="#C24516"/>
    <circle cx="120" cy="30" r="16" fill="#C24516"/>
    <circle cx="160" cy="36" r="14" fill="#C24516"/>
    <circle cx="100" cy="44" r="12" fill="#A63812"/>
    <circle cx="140" cy="44" r="12" fill="#A63812"/>
    <!-- 高光 -->
    <ellipse cx="70" cy="66" rx="20" ry="6" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- 飘动的营养星标 -->
  <g transform="translate(560 220)">
    <circle r="46" fill="#FFFFFF"/>
    <path d="M-14 0 L-4 -9 L14 -10 L6 2 L14 12 L0 7 L-14 12 L-6 2 L-14 -10 L-4 -9 Z" fill="#2B7A3D"/>
  </g>
  <text x="500" y="228" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#2B7A3D">高蛋白</text>
</svg>
