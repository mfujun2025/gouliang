    <path d="M24 60h72a4 4 0 0 1 4 4v6a20 20 0 0 1-20 20H40a20 20 0 0 1-20-20v-6a4 4 0 0 1 4-4z" fill="#E8602C"/>
    <circle cx="44" cy="62" r="4.5" fill="#FFF6EE"/>
    <circle cx="60" cy="58" r="5" fill="#FFF6EE"/>
    <circle cx="76" cy="62" r="4.5" fill="#FFF6EE"/>
    <circle cx="68" cy="68" r="3.6" fill="#FFB084"/>
    <circle cx="52" cy="68" r="3.6" fill="#FFB084"/>
